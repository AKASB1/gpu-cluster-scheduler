name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      GCS_REQUIRE_PYTHON: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Python harness dependencies
        run: python -m pip install -r harness/requirements.txt

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go tests with the race detector
        run: go test -race ./...

      - name: Python tests
        run: python -m pytest harness

      - name: Quick benchmark (smoke run)
        run: go run ./cmd/benchmark -quick -workers 2

      - name: No Python child left behind
        run: |
          if pgrep -f harness.policy_server; then
            echo "a harness process is still running"
            exit 1
          fi
